# 무료 요금제의 Supabase 프로젝트는 일주일간 아무 요청이 없으면 자동으로 멈춥니다.
# 멈춘 동안에는 홈페이지에서 신청을 넣어도 접수가 실패합니다.
# 그래서 3일마다 가볍게 한 번 찔러 깨어 있게 유지합니다.
#
# 사용 전 준비: 저장소 Settings > Secrets and variables > Actions 에 아래 두 개를 등록
#   SUPABASE_URL       예) https://xxxxxxxx.supabase.co
#   SUPABASE_ANON_KEY  공개(anon) 키
name: Supabase keepalive

on:
  schedule:
    - cron: "17 3 */3 * *"   # 3일마다 03:17 UTC (한국시간 낮 12시 17분)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 데이터베이스 깨우기
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_ANON_KEY 시크릿이 비어 있습니다."
            exit 1
          fi
          # 로그인하지 않은 상태로 호출하므로 아무 데이터도 돌아오지 않습니다.
          # 목적은 '요청이 있었다'는 사실을 남기는 것뿐입니다.
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/consultations?select=id&limit=1")
          echo "응답 코드: $code"
          case "$code" in
            200|401|403) echo "정상 — 프로젝트가 살아 있습니다." ;;
            *) echo "확인 필요 — 프로젝트가 멈췄을 수 있습니다."; exit 1 ;;
          esac
