<meta property="og:title" content="명동미래셀의원">
<meta property="og:description" content="줄기세포·재생의학 중심의 프리미엄 클리닉, 명동미래셀의원입니다.">

</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
  <p class="crumb">HOME &gt; 문의하기</p>
  <h1>문의하기</h1>
  <p>궁금하신 점을 남겨 주시면 확인 후 답변드립니다.</p>
</div>

<section class="block alt" id="form">
  <div class="container">
    <div class="form-result" id="form-result" hidden></div>
    <form class="form-wrap" data-consult-form="contact">
      <div class="form-row">
        <div class="field"><label for="ct-name">성함 <em>*</em></label><input id="ct-name" name="name" required maxlength="50" autocomplete="name" placeholder="홍길동"></div>
        <div class="field"><label for="ct-phone">연락처 <em>*</em></label><input id="ct-phone" name="phone" type="tel" required maxlength="20" autocomplete="tel" placeholder="010-0000-0000"></div>
      </div>
      <div class="field"><label for="ct-email">이메일</label><input id="ct-email" name="email" type="email" maxlength="120" autocomplete="email" placeholder="example@email.com"></div>
      <div class="field"><label for="ct-topic">문의 분야</label>
        <select id="ct-topic" name="topic">
          <option>줄기세포</option><option>피부과</option><option>성형외과</option><option>비뇨기과</option>
          <option>에스테틱</option><option>내성발톱</option><option>두피케어</option><option>림프해독</option>
          <option>월드투어</option><option>퀀텀 양자 진료치료</option><option>기타</option>
        </select>
      </div>
      <div class="field"><label for="ct-msg">문의 내용 <em>*</em></label><textarea id="ct-msg" name="message" required maxlength="2000" placeholder="문의하실 내용을 자유롭게 적어 주세요."></textarea></div>

      <!-- 사람에게는 보이지 않는 칸입니다. 자동 프로그램 차단용이니 지우지 마십시오. -->
      <div class="hp" aria-hidden="true"><label>홈페이지<input name="website" tabindex="-1" autocomplete="off"></label></div>

      <fieldset class="consent">
        <legend>개인정보 수집·이용 동의</legend>
        <label class="chk">
          <input type="checkbox" name="consent_privacy" required>
          <span><b>[필수]</b> 문의 답변을 위한 개인정보 수집·이용에 동의합니다.
            <em>수집 항목: 성함, 연락처, 이메일 · 이용 목적: 문의 답변 및 안내 · 보유 기간: 3년
            (동의를 거부하실 수 있으나, 이 경우 온라인 문의 접수가 어렵습니다.)</em></span>
        </label>
        <label class="chk">
          <input type="checkbox" name="consent_sensitive">
          <span><b>[선택]</b> 문의 내용에 포함된 건강 관련 정보(민감정보)의 수집·이용에 동의합니다.
            <em>동의하지 않으셔도 접수는 가능하며, 이 경우 문의 내용은 저장되지 않고 연락처만 접수됩니다.</em></span>
        </label>
        <p class="consent-link"><a href="privacy">개인정보처리방침 전문 보기</a></p>
      </fieldset>

      <p class="form-note">※ 접수 후 진료시간 내에 담당자가 남겨 주신 연락처로 답변드립니다.</p>
      <button class="btn btn-green" type="submit">문의 접수하기</button>
    </form>
  </div>
</section>

<div class="info-strip">
  <div class="container">
    <div class="info-item"><span class="ic">☎</span><div><h4>전화 문의</h4><p>02-776-8768</p></div></div>
    <div class="info-item"><span class="ic">✉</span><div><h4>이메일 문의</h4><p>mdmiraecellclinic@gmail.com</p></div></div>
    <div class="info-item"><span class="ic">◎</span><div><h4>방문 상담</h4><p>서울 중구 퇴계로 123, 7층</p></div></div>
  </div>
</div>

</html>
