<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의하기 | 명동미래셀의원</title>
<link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="명동미래셀의원">
<meta property="og:title" content="명동미래셀의원">
<meta property="og:description" content="줄기세포·재생의학 중심의 프리미엄 클리닉, 명동미래셀의원입니다.">
<meta property="og:image" content="https://mdmiraecell.com/images/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image"><link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<script>document.documentElement.classList.add("js")</script>
<link rel="stylesheet" href="css/style.css?v=56">
<link rel="stylesheet" href="css/anim.css?v=56">
</head>
<body data-i18n-title="page.contact.h1">
<div id="site-header"></div>

<div class="page-hero">
  <p class="crumb" data-i18n="page.contact.crumb">HOME &gt; 문의하기</p>
  <h1 data-i18n="page.contact.h1">문의하기</h1>
  <p data-i18n="page.contact.p">궁금하신 점을 남겨 주시면 확인 후 답변드립니다.</p>
</div>

<section class="block alt" id="form">
  <div class="container">
    <div class="form-result" id="form-result" hidden></div>
    <form class="form-wrap" data-consult-form="contact">
      <div class="form-row">
        <div class="field"><label for="ct-name"><span data-i18n="form.name">성함</span> <em>*</em></label><input id="ct-name" name="name" required maxlength="50" autocomplete="name" placeholder="홍길동" data-i18n-attr="placeholder:form.name.ph"></div>
        <div class="field"><label for="ct-phone"><span data-i18n="form.phone">연락처</span> <em>*</em></label><input id="ct-phone" name="phone" type="tel" required maxlength="20" autocomplete="tel" placeholder="010-0000-0000"></div>
      </div>
      <div class="field"><label for="ct-email" data-i18n="form.email">이메일</label><input id="ct-email" name="email" type="email" maxlength="120" autocomplete="email" placeholder="example@email.com"></div>
      <div class="field"><label for="ct-topic" data-i18n="form.topic.c">문의 분야</label>
        <select id="ct-topic" name="topic">
          <option value="줄기세포" data-i18n="svc.stemcell">줄기세포</option>
          <option value="피부과" data-i18n="svc.derma">피부과</option>
          <option value="성형외과" data-i18n="svc.plastic">성형외과</option>
          <option value="비뇨기과" data-i18n="svc.urology">비뇨기과</option>
          <option value="에스테틱" data-i18n="svc.esthetic">에스테틱</option>
          <option value="내성발톱" data-i18n="svc.toenail">내성발톱</option>
          <option value="두피케어" data-i18n="svc.scalp">두피케어</option>
          <option value="림프해독" data-i18n="svc.lymph">림프해독</option>
          <option value="월드투어" data-i18n="svc.worldtour">월드투어</option>
          <option value="퀀텀 양자 진료치료" data-i18n="svc.quantum">퀀텀 양자 진료치료</option>
          <option value="기타" data-i18n="form.topic.etc">기타</option>
        </select>
      </div>
      <div class="field"><label for="ct-msg"><span data-i18n="form.msg.c">문의 내용</span> <em>*</em></label><textarea id="ct-msg" name="message" required maxlength="2000" placeholder="문의하실 내용을 자유롭게 적어 주세요." data-i18n-attr="placeholder:form.msg.c.ph"></textarea></div>

      <!-- 사람에게는 보이지 않는 칸입니다. 자동 프로그램 차단용이니 지우지 마십시오. -->
      <div class="hp" aria-hidden="true"><label>홈페이지<input name="website" tabindex="-1" autocomplete="off"></label></div>

      <fieldset class="consent">
        <legend data-i18n="consent.legend">개인정보 수집·이용 동의</legend>
        <label class="chk">
          <input type="checkbox" name="consent_privacy" required>
          <span><b data-i18n="consent.req">[필수]</b> <span data-i18n="consent.req.c">문의 답변을 위한 개인정보 수집·이용에 동의합니다.</span>
            <em data-i18n="consent.req.c.d">수집 항목: 성함, 연락처, 이메일 · 이용 목적: 문의 답변 및 안내 · 보유 기간: 3년
            (동의를 거부하실 수 있으나, 이 경우 온라인 문의 접수가 어렵습니다.)</em></span>
        </label>
        <label class="chk">
          <input type="checkbox" name="consent_sensitive">
          <span><b data-i18n="consent.opt">[선택]</b> <span data-i18n="consent.opt.c">문의 내용에 포함된 건강 관련 정보(민감정보)의 수집·이용에 동의합니다.</span>
            <em data-i18n="consent.opt.c.d">동의하지 않으셔도 접수는 가능하며, 이 경우 문의 내용은 저장되지 않고 연락처만 접수됩니다.</em></span>
        </label>
        <p class="consent-link"><a href="privacy" data-i18n="consent.link">개인정보처리방침 전문 보기</a></p>
      </fieldset>

      <p class="form-note" data-i18n="form.note.c">※ 접수 후 진료시간 내에 담당자가 남겨 주신 연락처로 답변드립니다.</p>
      <button class="btn btn-green" type="submit" data-i18n="form.submit.c">문의 접수하기</button>
    </form>
  </div>
</section>

<div class="info-strip">
  <div class="container">
    <div class="info-item"><span class="ic">☎</span><div><h4 data-i18n="contact.info.tel">전화 문의</h4><p>02-776-8768</p></div></div>
    <div class="info-item"><span class="ic">✉</span><div><h4 data-i18n="contact.info.email">이메일 문의</h4><p>mdmiraecellclinic@gmail.com</p></div></div>
    <div class="info-item"><span class="ic">◎</span><div><h4 data-i18n="contact.info.visit">방문 상담</h4><p data-i18n="site.addr.short">서울 중구 퇴계로 123, 7층</p></div></div>
  </div>
</div>

<div id="site-footer"></div>
<script src="js/config.js?v=56"></script>
<script src="js/form.js?v=56"></script>
<script src="js/lang.js?v=56"></script>
<script src="js/i18n.js?v=56"></script>
<script src="js/main.js?v=56"></script>
<script src="js/anim.js?v=56"></script>
</body>
</html>
