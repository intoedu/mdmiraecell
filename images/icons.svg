<svg xmlns="http://www.w3.org/2000/svg">
<!--
  명동미래셀의원 · 아이콘 묶음
  ─────────────────────────────────────────────
  이모지·기호 문자(☎ ◎ ✉ ✦ ❀ …) 대신 쓰는, 직접 그린 선 아이콘입니다.
  · 모두 24×24 칸, 같은 굵기의 둥근 선으로 그려 한 벌처럼 보입니다.
  · 색은 글자색(currentColor)을 따라가므로, 놓이는 자리의 글자색만 바꾸면 됩니다.
  · 쓰는 법:  <svg class="i" aria-hidden="true"><use href="images/icons.svg?v=1#i-phone"></use></svg>
    굵기·크기 같은 공통 모양은 css/style.css 의 .i 규칙에 있습니다.
  · 기기나 운영체제마다 다르게 보이던 이모지와 달리, 어디서나 똑같이 보입니다.
-->
<defs>

