<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="icon" type="image/svg+xml" href="images/favicon.svg?v=2">
<meta property="og:type" content="website">
<meta property="og:site_name" content="명동미래셀의원">
<meta property="og:title" content="명동미래셀의원">
<meta property="og:description" content="줄기세포·재생의학 중심의 프리미엄 클리닉, 명동미래셀의원입니다.">
<meta property="og:image" content="https://mdmiraecell.com/images/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="stylesheet" href="css/style.css?v=34">
</head>
<body>
<div id="site-header"></div>

<div class="page-hero">
  <p class="crumb">HOME &gt; 신청·예약</p>
  <h1>진료 예약 신청</h1>
  <p>원하시는 일정을 남겨 주시면 확인 후 연락드립니다.</p>
</div>

<section class="block alt" id="form">
  <div class="container">
    <form class="form-wrap" id="reserve-form">
      <div class="form-row">
        <div class="field"><label>성함 <em>*</em></label><input name="성함" required placeholder="홍길동"></div>
        <div class="field"><label>연락처 <em>*</em></label><input name="연락처" type="tel" required placeholder="010-0000-0000"></div>
      </div>
      <div class="form-row">
        <div class="field"><label>희망 날짜 <em>*</em></label><input name="희망날짜" type="date" required></div>
        <div class="field"><label>희망 시간대</label>
          <select name="희망시간대"><option>오전</option><option>오후</option><option>상관없음</option></select>
        </div>
      </div>
      <div class="field"><label>진료 분야 <em>*</em></label>
        <select name="진료분야" required>
          <option>줄기세포</option><option>피부과</option><option>성형외과</option><option>비뇨기과</option>
          <option>에스테틱</option><option>내성발톱</option><option>두피케어</option><option>림프해독</option>
          <option>월드투어</option><option>퀀텀 양자 진료치료</option><option>기타</option>
        </select>
      </div>
      <div class="field"><label>상담 내용</label><textarea name="상담내용" placeholder="증상이나 궁금하신 점을 적어 주시면 상담에 도움이 됩니다."></textarea></div>
      <p class="form-note">※ 신청하기를 누르면 이메일 앱이 열리며, 작성하신 내용이 담긴 메일을 보내실 수 있습니다. 접수 확인 후 전화로 예약을 확정해 드립니다.</p>
      <button class="btn btn-green" type="submit">예약 신청하기</button>
    </form>
    <p style="text-align:center;margin-top:26px;color:var(--gray)">급하신 경우 <a href="tel:027768768" style="color:var(--green);font-weight:800">02-776-8768</a> 로 전화 주세요.</p>
  </div>
</section>

<div id="site-footer"></div>
<script src="js/main.js?v=34"></script>
</body>
</html>
